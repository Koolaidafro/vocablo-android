name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (verbs, themes, scheduling, cards, dictionary, games)
        run: ./gradlew :core:verbs:test :core:design:test :core:srs:test :core:cards:test :core:dictionary:test :core:play:test
      - name: App tests (database, on Robolectric)
        run: ./gradlew :app:testDebugUnitTest
      - name: Build the app
        run: ./gradlew :app:assembleDebug
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
